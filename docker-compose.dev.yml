services:
  mongo:
    image: mongo:8.0
    container_name: mongo-db
    restart: unless-stopped
    user: '999:999' # run as mongodb user inside the image
    env_file:
      - .env.dev
    ports:
      - '${MONGO_PORT:-27017}:27017'

    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./scripts/mongo-init.sh:/usr/local/bin/mongo-init.sh:ro

    entrypoint: ['/usr/local/bin/mongo-init.sh']

    networks:
      mongo-host-access:
        aliases:
          - mongo

    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
    name: mongo-data-store

  mongo-config:
    name: mongo-config-store

networks:
  mongo-host-access:
    name: mongo-host-access
    driver: bridge
